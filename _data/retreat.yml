# Structured content for the Developer Studio Retreat page.
# Prose lives in index.md. Lists live here.

schedule:
  - time: 8:00 – 9:00 AM
    title: Breakfast Standup
    detail: A 15-minute sync. <em>What is your single deliverable today?</em>
  - time: 9:00 AM – 1:00 PM
    title: Deep Work Block 1
    detail: In-room focus or quiet zones. No interruptions.
  - time: 1:00 – 2:00 PM
    title: Walking Lunch
    detail: A low-key break, a coffee run, or a paired walk outside.
  - time: 2:00 – 5:30 PM
    title: Deep Work Block 2
    detail: A second focus sprint, or async collaboration.
  - time: 5:30 – 6:30 PM
    title: Show &amp; Tell
    detail: Five-minute lightning demos of what was written or built.
  - time: 7:00 PM onward
    title: Dinner &amp; Salons
    detail: A communal meal, the patio fire pit, or open architectural discussions.

principles:
  - icon: door
    title: Private basecamps
    detail: "Individual extended-stay suites: a desk, a mini-kitchen, and a separate sleeping space."
  - icon: card
    title: No roommate overhead
    detail: You book your own room directly, with points or a card. Zero host liability.
  - icon: headphones
    title: The headphone norm
    detail: Over-ear headphones are an invisible wall. No obligation to socialize during focus blocks.
  - icon: target
    title: High task-clarity
    detail: "Built for self-directed heavy lifts: a book, a major architecture shift, deep compiler work, a standalone tool."

questions:
  - What project would you bring that benefits from four days of isolated momentum?
  - What daily cadence or structure keeps you in flow?
  - What locations, amenities, or norms would make this an instant "yes" for you?
